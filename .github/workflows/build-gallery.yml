name: Build Gallery

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install
          npm audit fix --force

      - name: Run the build
        run: |
          npm run build

      - name: Log build info
        run: |
          echo 'Build completed at $(date)' >> build-log.txt

      - name: Upload build log
        uses: actions/upload-artifact@v2
        with:
          name: build-log
          path: build-log.txt

      - name: Notify on failure
        if: ${{ failure() }}
        run: |
          echo 'Build failed, check the logs!'